<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чат · ID аккаунта · поиск</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  html,body { height:100%; }
  body {
    background: radial-gradient(circle at 20% 20%, #22364d 0%, #0f1a26 60%, #08111a 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
  }

  .app {
    width:100%; max-width:680px; height:85vh; min-height:540px;
    background:#fff; border-radius:26px;
    box-shadow:0 25px 60px -10px rgba(0,0,0,.6);
    display:flex; flex-direction:column; overflow:hidden; position:relative;
    animation: appIn .45s cubic-bezier(.2,.9,.3,1.1);
  }
  @keyframes appIn { from{opacity:0;transform:translateY(18px) scale(.97);} to{opacity:1;transform:none;} }

  /* ============ АВТОРИЗАЦИЯ ============ */
  #auth {
    position:absolute; inset:0; background:#fff; z-index:5;
    padding:40px 30px; display:flex; flex-direction:column; justify-content:center;
    gap:14px; transition:opacity .3s ease, transform .3s ease;
  }
  #auth.hide { opacity:0; transform:scale(.96); pointer-events:none; }
  #auth h1 { text-align:center; color:#0b1e2e; font-size:1.6rem; margin-bottom:6px; }

  .tabs {
    display:flex; gap:6px; background:#f1f5f9; padding:5px;
    border-radius:14px; position:relative; margin-bottom:4px;
  }
  .tabs .ind {
    position:absolute; top:5px; left:5px; width:calc(50% - 5px); height:calc(100% - 10px);
    background:#fff; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.08);
    transition:transform .35s cubic-bezier(.4,.9,.3,1.1);
  }
  .tabs[data-mode="reg"] .ind { transform:translateX(calc(100% + 6px)); }
  .tabs button {
    flex:1; border:none; background:transparent; padding:11px;
    border-radius:10px; cursor:pointer; font-weight:600; color:#64748b;
    font-size:.95rem; position:relative; z-index:1; transition:color .25s;
  }
  .tabs button.active { color:#0b1e2e; }

  .field {
    border-radius:12px; overflow:hidden;
    transition: height .3s ease, opacity .25s ease, margin .3s ease;
    height:50px;
  }
  .field.collapsed { height:0; opacity:0; margin:0; pointer-events:none; }

  #auth input {
    width:100%; height:50px; padding:14px 16px;
    border:1.5px solid #dce3eb; border-radius:12px; font-size:.95rem;
    outline:none; background:#f9fcff; transition:.2s;
  }
  #auth input:focus { border-color:#0b1e2e; background:#fff; box-shadow:0 0 0 4px rgba(11,30,46,.08); }

  #authBtn {
    padding:14px; border:none; border-radius:12px; background:#0b1e2e;
    color:#fff; font-weight:600; font-size:1rem; cursor:pointer;
    transition:.2s; box-shadow:0 6px 16px -6px rgba(11,30,46,.5);
  }
  #authBtn:hover { background:#1e3a5f; }
  #authBtn:active { transform:scale(.98); }

  #err { color:#b91c1c; text-align:center; font-size:.85rem; min-height:18px; }
  .note { font-size:.75rem; color:#94a3b8; text-align:center; }

  /* ============ ЧАТ ============ */
  #chat { display:none; flex-direction:column; flex:1; overflow:hidden; }
  #chat.show { display:flex; animation: fade .4s ease; }
  @keyframes fade { from{opacity:0;} to{opacity:1;} }

  .head {
    padding:14px 20px; background:#fff; border-bottom:1px solid #e9edf2;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .who { display:flex; align-items:center; gap:12px; min-width:0; }
  .ava {
    width:42px; height:42px; border-radius:50%;
    background:linear-gradient(135deg,#0b1e2e,#1e3a5f); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:1rem; flex-shrink:0;
    box-shadow:0 4px 10px -3px rgba(11,30,46,.5);
    transition:transform .25s;
  }
  .ava:hover { transform:scale(1.06) rotate(-3deg); }
  .who .n { font-weight:600; color:#0b1e2e; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .who .id { font-size:.72rem; color:#64748b; font-family:ui-monospace,monospace; }
  .who .id b { color:#0b1e2e; font-weight:700; }

  .acts { display:flex; gap:4px; }
  .ico {
    width:38px; height:38px; border:none; background:transparent; border-radius:50%;
    cursor:pointer; font-size:1.05rem; color:#64748b;
    display:flex; align-items:center; justify-content:center; transition:.2s;
  }
  .ico:hover { background:#f1f5f9; color:#0b1e2e; transform:scale(1.08); }
  .ico:active { transform:scale(.92); }
  .ico.del:hover { background:#fee2e2; color:#b91c1c; }
  .ico.on { background:#0b1e2e; color:#fff; }

  #searchBar {
    max-height:0; overflow:hidden; padding:0 20px; background:#f8fafd;
    transition:max-height .35s cubic-bezier(.4,.9,.3,1.1), padding .35s;
  }
  #searchBar.open { max-height:100px; padding:10px 20px; border-bottom:1px solid #e9edf2; }
  #searchInput {
    width:100%; padding:11px 16px; border:1.5px solid #dce3eb; border-radius:30px;
    font-size:.9rem; outline:none; background:#fff; transition:.2s;
  }
  #searchInput:focus { border-color:#0b1e2e; box-shadow:0 0 0 4px rgba(11,30,46,.08); }
  #searchInfo { font-size:.72rem; color:#64748b; text-align:center; min-height:14px; margin-top:6px; }

  #msgs {
    flex:1; overflow-y:auto; padding:20px; background:#f8fafd;
    display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth;
  }
  #msgs::-webkit-scrollbar { width:6px; }
  #msgs::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:20px; }

  .msg { max-width:80%; display:flex; flex-direction:column; animation:min .35s cubic-bezier(.2,.9,.3,1.15); }
  @keyframes min { from{opacity:0;transform:translateY(14px) scale(.96);} to{opacity:1;transform:none;} }
  .msg.out { align-self:flex-end; }
  .msg.in { align-self:flex-start; }

  .bub {
    padding:11px 15px; border-radius:18px; font-size:.93rem;
    line-height:1.45; word-break:break-word; transition:box-shadow .25s;
  }
  .in .bub { background:#fff; border:1px solid #e2e8f0; border-bottom-left-radius:5px; color:#0b1e2e; }
  .out .bub { background:#0b1e2e; color:#fff; border-bottom-right-radius:5px; box-shadow:0 4px 12px -4px rgba(11,30,46,.4); }

  .meta { display:flex; gap:6px; font-size:.68rem; color:#64748b; margin-top:4px; padding:0 6px; flex-wrap:wrap; }
  .out .meta { justify-content:flex-end; }
  .meta b { color:#334155; font-weight:600; }
  .meta .id-badge {
    font-family:ui-monospace,monospace;
    background:#eef2f7; color:#334155; padding:1px 6px; border-radius:6px;
    font-size:.65rem; font-weight:600;
  }
  .out .meta .id-badge { background:rgba(255,255,255,.15); color:#cbd5e1; }

  .msg.hl .bub { box-shadow:0 0 0 3px #fbbf24; background:#fffbeb; color:#0b1e2e; }
  mark { background:#fde68a; border-radius:3px; padding:0 2px; }

  .empty { text-align:center; color:#94a3b8; font-size:.85rem; padding:30px 20px; }
  .empty .big { font-size:1.6rem; display:block; margin-bottom:8px; }

  .foot {
    padding:12px 16px; background:#fff; border-top:1px solid #e9edf2;
    display:flex; gap:10px; align-items:center;
  }
  #msgInput {
    flex:1; padding:13px 18px; border:1.5px solid #dce3eb; border-radius:40px;
    font-size:.93rem; outline:none; background:#f9fcff; transition:.2s;
  }
  #msgInput:focus { border-color:#0b1e2e; background:#fff; box-shadow:0 0 0 4px rgba(11,30,46,.08); }
  #sendBtn {
    width:50px; height:50px; border:none; border-radius:50%; background:#0b1e2e;
    color:#fff; font-size:1.2rem; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    transition:.2s; box-shadow:0 6px 14px -4px rgba(11,30,46,.5);
  }
  #sendBtn:hover { background:#1e3a5f; transform:scale(1.06); }
  #sendBtn:active { transform:scale(.92); }
</style>
</head>
<body>

<div class="app">

  <!-- ==== АВТОРИЗАЦИЯ ==== -->
  <div id="auth">
    <h1>💬 Мессенджер</h1>

    <div class="tabs" id="tabs" data-mode="login">
      <div class="ind"></div>
      <button class="active" data-m="login">Вход</button>
      <button data-m="reg">Регистрация</button>
    </div>

    <input id="inLogin" placeholder="Логин" maxlength="20" autocomplete="off">
    <input id="inPass" type="password" placeholder="Пароль" autocomplete="off">
    <div class="field collapsed" id="confirmField">
      <input id="inPass2" type="password" placeholder="Повторите пароль" autocomplete="off">
    </div>

    <button id="authBtn">Войти</button>
    <div id="err"></div>
    <div class="note">Каждому аккаунту выдаётся случайный ID</div>
  </div>

  <!-- ==== ЧАТ ==== -->
  <div id="chat">
    <div class="head">
      <div class="who">
        <div class="ava" id="ava">?</div>
        <div style="min-width:0">
          <div class="n" id="uName">—</div>
          <div class="id" id="uId">ID: —</div>
        </div>
      </div>
      <div class="acts">
        <button class="ico" id="searchBtn" title="Поиск">🔍</button>
        <button class="ico del" id="clearBtn" title="Очистить">🗑️</button>
        <button class="ico del" id="exitBtn" title="Выйти">⎋</button>
      </div>
    </div>

    <div id="searchBar">
      <input id="searchInput" placeholder="Поиск по тексту, логину или ID...">
      <div id="searchInfo"></div>
    </div>

    <div id="msgs"></div>

    <div class="foot">
      <input id="msgInput" placeholder="Сообщение..." autocomplete="off">
      <button id="sendBtn">➤</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var UK='chat_u_v5', SK='chat_s_v5', MK='chat_m_v5';

  function $(id){ return document.getElementById(id); }
  function getUsers(){ try{return JSON.parse(localStorage.getItem(UK)||'{}');}catch(e){return{};} }
  function setUsers(u){ try{localStorage.setItem(UK,JSON.stringify(u));}catch(e){} }
  function getMsgs(){ try{return JSON.parse(localStorage.getItem(MK)||'[]');}catch(e){return[];} }
  function setMsgs(m){ try{localStorage.setItem(MK,JSON.stringify(m));}catch(e){} }

  function t(){
    var d=new Date();
    return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

  // ===== ГЕНЕРАЦИЯ СЛУЧАЙНОГО ID АККАУНТА =====
  // 9-значный ID: 100 000 000 – 999 999 999, гарантированно уникальный
  function generateId(){
    var users=getUsers();
    var used={};
    for(var k in users){ if(users[k].id) used[users[k].id]=true; }

    for(var i=0;i<200;i++){
      var id=Math.floor(100000000 + Math.random()*900000000);
      if(!used[id]) return id;
    }
    // fallback — с временной меткой
    return Date.now();
  }

  function formatId(id){
    // 123456789 → 123 456 789
    return String(id).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  }

  // ===== АВТОРИЗАЦИЯ =====
  var mode='login';
  var tabs=$('tabs');
  var inLogin=$('inLogin'), inPass=$('inPass'), inPass2=$('inPass2');
  var confirmField=$('confirmField');
  var authBtn=$('authBtn'), err=$('err');

  tabs.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      mode=b.dataset.m;
      tabs.dataset.mode=mode;
      tabs.querySelectorAll('button').forEach(function(x){ x.classList.toggle('active', x===b); });
      if(mode==='reg'){
        confirmField.classList.remove('collapsed');
        authBtn.textContent='Зарегистрироваться';
      } else {
        confirmField.classList.add('collapsed');
        authBtn.textContent='Войти';
      }
      err.textContent='';
      inLogin.focus();
    };
  });

  authBtn.onclick=function(){
    err.textContent='';
    var login=inLogin.value.trim();
    var pass=inPass.value;

    if(!login || !pass){ err.textContent='Заполните поля'; return; }
    if(login.length<3){ err.textContent='Логин от 3 символов'; return; }
    if(pass.length<3){ err.textContent='Пароль от 3 символов'; return; }

    var users=getUsers();
    var key=login.toLowerCase();

    if(mode==='reg'){
      if(pass!==inPass2.value){ err.textContent='Пароли не совпадают'; return; }
      if(users[key]){ err.textContent='Такой логин уже занят'; return; }

      var newId=generateId();
      users[key]={
        login:login,
        password:pass,
        id:newId,
        createdAt:Date.now()
      };
      setUsers(users);
      enterChat(users[key]);
      return;
    }

    // Вход
    var u=users[key];
    if(!u){ err.textContent='Пользователь не найден'; return; }
    if(u.password!==pass){ err.textContent='Неверный пароль'; return; }

    // На случай старых аккаунтов без id
    if(!u.id){
      u.id=generateId();
      users[key]=u;
      setUsers(users);
    }

    enterChat(u);
  };

  // Enter в полях
  [inLogin,inPass,inPass2].forEach(function(el){
    el.addEventListener('keydown',function(e){
      if(e.key==='Enter'){ e.preventDefault(); authBtn.click(); }
    });
  });

  // ===== ВХОД В ЧАТ =====
  var currentUser=null;

  function enterChat(user){
    currentUser=user;
    try{ localStorage.setItem(SK, JSON.stringify({login:user.login})); }catch(e){}

    $('uName').textContent=user.login;
    $('uId').innerHTML='ID: <b>'+formatId(user.id)+'</b>';
    $('ava').textContent=user.login.charAt(0).toUpperCase();

    $('auth').classList.add('hide');
    setTimeout(function(){
      $('auth').style.display='none';
      $('chat').classList.add('show');
      render('');
      $('msgInput').focus();
    },280);
  }

  // ===== ВЫХОД =====
  $('exitBtn').onclick=function(){
    try{ localStorage.removeItem(SK); }catch(e){}
    currentUser=null;
    $('chat').classList.remove('show');
    $('auth').style.display='flex';
    requestAnimationFrame(function(){ $('auth').classList.remove('hide'); });

    inLogin.value=''; inPass.value=''; inPass2.value='';
    err.textContent='';
    mode='login';
    tabs.dataset.mode='login';
    tabs.querySelectorAll('button').forEach(function(x){
      x.classList.toggle('active', x.dataset.m==='login');
    });
    confirmField.classList.add('collapsed');
    authBtn.textContent='Войти';
    inLogin.focus();
  };

  // ===== ОТРИСОВКА =====
  var msgsEl=$('msgs'), searchInfo=$('searchInfo');

  function buildEl(m, q){
    var own = currentUser && m.author===currentUser.login;
    var div=document.createElement('div');
    div.className='msg '+(own?'out':'in');

    var idStr = m.authorId ? formatId(m.authorId) : '';
    var textLow = (m.text||'').toLowerCase();
    var authorLow = (m.author||'').toLowerCase();
    var idLow = String(m.authorId||'').toLowerCase();

    if(q){
      var hit = textLow.indexOf(q)>-1 ||
                authorLow.indexOf(q)>-1 ||
                idLow.indexOf(q.replace(/\s/g,''))>-1 ||
                idStr.toLowerCase().indexOf(q)>-1;
      if(hit) div.classList.add('hl');
    }

    var bub=document.createElement('div');
    bub.className='bub';
    if(q && textLow.indexOf(q)>-1){
      var re=new RegExp('('+escRe(q)+')','gi');
      bub.innerHTML=esc(m.text).replace(re,'<mark>$1</mark>');
    } else {
      bub.textContent=m.text;
    }

    var meta=document.createElement('div');
    meta.className='meta';

    var a=document.createElement('b');
    a.textContent = own ? 'Вы' : (m.author||'Гость');
    meta.appendChild(a);

    if(idStr){
      var badge=document.createElement('span');
      badge.className='id-badge';
      badge.textContent='#'+idStr;
      meta.appendChild(badge);
    }

    var tm=document.createElement('span');
    tm.textContent=m.time;
    meta.appendChild(tm);

    div.appendChild(bub);
    div.appendChild(meta);
    return div;
  }

  function render(qRaw){
    var q=(qRaw||'').trim().toLowerCase();
    var qNoSpace=q.replace(/\s/g,'');
    var all=getMsgs();

    var list = q ? all.filter(function(m){
      var t=(m.text||'').toLowerCase();
      var a=(m.author||'').toLowerCase();
      var id=String(m.authorId||'');
      var idSp=formatId(m.authorId||'').toLowerCase();
      return t.indexOf(q)>-1 ||
             a.indexOf(q)>-1 ||
             id.indexOf(qNoSpace)>-1 ||
             idSp.indexOf(q)>-1;
    }) : all;

    var frag=document.createDocumentFragment();

    if(!list.length){
      var emp=document.createElement('div');
      emp.className='empty';
      if(q){
        emp.innerHTML='<span class="big">🔍</span>Ничего не найдено по запросу «'+esc(qRaw)+'»';
      } else {
        emp.innerHTML='<span class="big">💬</span>Пока пусто. Напишите первым!';
      }
      frag.appendChild(emp);
    } else {
      list.forEach(function(m){ frag.appendChild(buildEl(m,q)); });
    }

    msgsEl.innerHTML='';
    msgsEl.appendChild(frag);

    searchInfo.textContent = q ? ('Найдено: '+list.length+' из '+all.length) : '';
    if(!q) msgsEl.scrollTop=msgsEl.scrollHeight;
  }

  // ===== ОТПРАВКА =====
  function send(){
    var text=$('msgInput').value.trim();
    if(!text || !currentUser) return;

    var all=getMsgs();
    all.push({
      author: currentUser.login,
      authorId: currentUser.id,
      text: text,
      time: t()
    });
    setMsgs(all);

    $('msgInput').value='';
    $('msgInput').focus();

    if($('searchBar').classList.contains('open') && $('searchInput').value){
      $('searchInput').value='';
      render('');
      return;
    }

    var q=$('searchInput').value.trim();
    if(q){
      render(q);
    } else {
      var emp=msgsEl.querySelector('.empty');
      if(emp){
        render('');
      } else {
        var last=all[all.length-1];
        msgsEl.appendChild(buildEl(last,''));
        requestAnimationFrame(function(){
          msgsEl.scrollTo({top:msgsEl.scrollHeight, behavior:'smooth'});
        });
      }
    }
  }

  $('sendBtn').onclick=send;
  $('msgInput').addEventListener('keydown',function(e){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });

  // ===== ОЧИСТКА =====
  $('clearBtn').onclick=function(){
    if(confirm('Очистить всю историю сообщений?')){
      setMsgs([]);
      render($('searchInput').value);
    }
  };

  // ===== ПОИСК =====
  var searchBtn=$('searchBtn'), searchBar=$('searchBar'), searchInput=$('searchInput');

  searchBtn.onclick=function(){
    var open=searchBar.classList.toggle('open');
    searchBtn.classList.toggle('on', open);
    if(open){
      setTimeout(function(){ searchInput.focus(); },200);
    } else {
      searchInput.value='';
      render('');
    }
  };

  var tmr;
  searchInput.addEventListener('input',function(){
    clearTimeout(tmr);
    tmr=setTimeout(function(){ render(searchInput.value); },120);
  });

  // ===== ВОССТАНОВЛЕНИЕ СЕССИИ =====
  (function(){
    var s;
    try{ s=localStorage.getItem(SK); }catch(e){ return; }
    if(!s) return;

    try{
      var data=JSON.parse(s);
      var u=getUsers()[data.login.toLowerCase()];
      if(!u){ localStorage.removeItem(SK); return; }
      if(!u.id){
        u.id=generateId();
        var all=getUsers();
        all[data.login.toLowerCase()]=u;
        setUsers(all);
      }

      currentUser=u;
      $('uName').textContent=u.login;
      $('uId').innerHTML='ID: <b>'+formatId(u.id)+'</b>';
      $('ava').textContent=u.login.charAt(0).toUpperCase();

      $('auth').style.display='none';
      $('chat').classList.add('show');
      render('');
      $('msgInput').focus();
    }catch(e){
      try{ localStorage.removeItem(SK); }catch(_){}
    }
  })();

})();
</script>
</body>
</html>
